# correct-kit policy: what an unattended agent run may change in a draft PR.
# Generated by correct-setup from the contract; edit here, not in the workflow.
# `*` matches across `/`. First matching `deny` wins. One entry per line.

# Paths the agent may change.
allow: {{ALLOW_SOURCE}}            # e.g. src/*.ts, lib/*.dart
allow: {{ALLOW_TESTS}}             # e.g. test/*, tests/*
allow: {{ALLOW_TOOLS}}             # e.g. tool/*, scripts/*
allow: docs/*.md

# Never: hard rules, product features, schema, dependencies, platforms, CI, agent instructions, decisions.
deny: .github/*
deny: .claude/*
deny: CLAUDE.md
deny: AGENTS.md
deny: {{ADR_DIR}}/*
deny: {{DEPENDENCY_MANIFESTS}}     # e.g. package.json, package-lock.json, pubspec.*
deny: {{FEATURE_DIRS}}             # user-visible feature code, e.g. src/features/*
deny: {{SCHEMA_PATHS}}             # database schema and migrations
deny: *.env*
deny: *secret*
deny: *key*

# A fix must add or extend a check in one of these.
check: {{ALLOW_TESTS}}
check: {{ALLOW_TOOLS}}

# Test files: never fewer test/assert lines than before, never skipped.
tests: {{ALLOW_TESTS}}
test_marker: {{TEST_MARKER_REGEX}} # e.g. (test|it|describe|expect)\(
# Baselines of existing violations may only shrink.
baseline: *baseline*

max_files: 10
max_lines: 600

# Patterns that break a hard rule when added outside tests: <regex> | <reason>
# forbid: writeAsBytes | Rule 1: image data on disk
# Agents never add exceptions to a check (contract, ## Limits):
forbid: correct-allow\( | exception to a check added; only the owner approves exceptions
