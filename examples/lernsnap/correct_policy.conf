# LernSnap (Flutter), the project this kit was extracted from. ADR 0010.
allow: lib/*.dart
allow: test/*
allow: tool/*
allow: docs/*.md
allow: GLOSSARY.md

deny: lib/features/*
deny: lib/core/database/*
deny: lib/l10n/*
deny: lib/core/constants/prompts.dart
deny: lib/core/constants/pedagogy.dart
deny: *.g.dart
deny: pubspec.*
deny: analysis_options.yaml
deny: android/*
deny: ios/*
deny: assets/*
deny: integration_test/*
deny: .github/*
deny: .claude/*
deny: CLAUDE.md
deny: docs/adr/*
deny: docs/plans/*
deny: docs/archive/*
deny: *.env*
deny: *key*

check: test/*
check: tool/*

tests: test/*
test_marker: (test|testWidgets|group|expect)\(
baseline: *baseline*

max_files: 10
max_lines: 600

forbid: writeAsBytes | Rule 1: image data on disk
forbid: firebase|supabase|cloud_firestore | Rule 5: cloud database
forbid: AIza|api_?key *= *["'] | Rule 6: key in the client
forbid: \bhive\b|HiveObject | Rule 10: Hive
forbid: gemini-[0-9] | Rule 11: model id
forbid: Navigator\.push | Convention: go_router, no Navigator.push
forbid: catch *\([^)]*\) *\{ *\} | Rule 13: empty catch
# Agents never add exceptions to a check (contract, ## Limits).
forbid: correct-allow\( | exception to a check added; only the owner approves exceptions
